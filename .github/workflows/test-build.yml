name: Downgrader 2.0 — Windows and Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Full commit pins keep action code immutable; comments identify the upstream release/ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4: backport fixes (#2524)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: python -m PyInstaller --clean -y FOLON-Downgrader.spec
      - name: Check standalone Windows output
        if: runner.os == 'Windows'
        run: python packaging/verify-windows-onefile.py
      - name: Build Linux GUI AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL: /tmp/appimagetool.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_RUNTIME: /tmp/appimage-runtime
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$APPIMAGETOOL"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o "$APPIMAGE_RUNTIME"
          chmod +x "$APPIMAGETOOL"
          packaging/linux/build-appimage.sh
          dist/Downgrader-2.0-x86_64.AppImage --appimage-extract-and-run --help
      - name: Smoke test packaged CLI and GUI
        run: python packaging/smoke-test.py
      - name: Name Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/Downgrader-2.0.exe dist/FOLON-Downgrader-2.0.0-Windows-x64.exe
          Move-Item dist/Downgrader-2.0-cli.exe dist/FOLON-Downgrader-2.0.0-Windows-x64-CLI.exe
      - name: Name Linux release files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mv dist/Downgrader-2.0-x86_64.AppImage dist/FOLON-Downgrader-2.0.0-Linux-x86_64.AppImage
          cd dist
          sha256sum FOLON-Downgrader-2.0.0-Linux-x86_64.AppImage > FOLON-Downgrader-2.0.0-Linux-x86_64.AppImage.sha256
          rm -f Downgrader-2.0-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FOLON-Downgrader-2.0.0-${{ runner.os }}-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.sha256
